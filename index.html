<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trening">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Treningslogg</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="top"></header>
  <main id="app"></main>
  <nav id="nav">
    <button data-action="nav" data-view="programs">
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></span>
      <span class="lbl">Program</span>
    </button>
    <button data-action="nav" data-view="library">
      <span class="ico"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12h8M8 15.5h5"/></svg></span>
      <span class="lbl">Øvelser</span>
    </button>
    <button data-action="nav" data-view="history">
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <span class="lbl">Logg</span>
    </button>
    <button data-action="nav" data-view="profile">
      <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.3 7.5-5.3s6.3 1.7 7.5 5.3"/></svg></span>
      <span class="lbl">Profil</span>
    </button>
  </nav>
  <script src="app.js"></script>
</body>
</html>
